<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScreenGo 2FA Generator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/otpauth/9.2.2/otpauth.umd.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080808;
            color: white;
        }
        .font-mono {
            font-family: 'JetBrains Mono', monospace;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Card -->
    <div class="w-full max-w-[500px] bg-[#121212] border border-[#222222] rounded-2xl p-10 shadow-[0_30px_60px_rgba(0,0,0,0.5)] text-center">
        
        <!-- Header -->
        <div class="flex items-center justify-between mb-10 w-full">
            <div class="flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FF6600" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-6 h-6"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></svg>
                <div class="font-extrabold tracking-tight text-2xl text-white">
                    screen<span class="text-[#FF6600]">Go</span>
                </div>
            </div>
            <div class="flex items-center gap-2">
                <span class="text-[10px] text-[#888888] uppercase tracking-wider">Encrypted</span>
                <div class="w-2 h-2 bg-[#FF6600] rounded-full shadow-[0_0_10px_#FF6600]"></div>
            </div>
        </div>

        <!-- Input Section -->
        <div class="text-left mb-[30px]">
            <label for="secret" class="text-[11px] uppercase tracking-[1.5px] text-[#888888] mb-2.5 block">
                2FA Secret Key
            </label>
            <input
                id="secret"
                type="text"
                placeholder="Ingrese su clave secreta..."
                class="w-full bg-[#1a1a1a] border border-[#222222] rounded-lg px-4 py-3.5 text-white font-mono text-sm outline-none focus:border-[#FF6600] transition-colors"
                autocomplete="off"
                spellcheck="false"
            />
            <p id="error-msg" class="text-red-400 text-sm mt-2 hidden">Secret inválido. Verifica que sea Base32.</p>
        </div>

        <!-- Code Display Section -->
        <label class="text-[11px] uppercase tracking-[1.5px] text-[#888888] mb-2.5 block text-center">
            Código de verificación
        </label>
        <div class="bg-black rounded-xl py-[30px] mb-5 border border-[#1a1a1a] relative overflow-hidden flex justify-center">
            <div id="code-display" class="font-mono text-5xl sm:text-6xl font-bold tracking-[8px] text-[#FF6600] drop-shadow-[0_0_20px_rgba(255,102,0,0.2)] transition-all duration-300">
                000 000
            </div>
            <div class="absolute bottom-0 left-0 w-full h-1 bg-[#1a1a1a]">
                <div id="progress-bar" class="h-full bg-[#FF6600] shadow-[0_0_10px_#FF6600] transition-all duration-1000 ease-linear" style="width: 100%"></div>
            </div>
        </div>

        <!-- Action Buttons -->
        <button
            id="copy-btn"
            disabled
            class="bg-[#FF6600] text-black border-none rounded-lg py-4 w-full font-bold text-sm uppercase tracking-[1px] hover:opacity-90 transition-opacity flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed"
        >
            <svg id="copy-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
            <svg id="check-icon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="hidden"><path d="M20 6 9 17l-5-5"/></svg>
            <span id="copy-text">Copiar Código</span>
        </button>

        <!-- Footer Info -->
        <div class="mt-[30px] text-xs text-[#888888]">
            El código cambia en <span id="time-left" class="text-white">30 segundos</span>
        </div>

        <div class="inline-block px-2 py-1 bg-[#1a1a1a] rounded mt-5 text-[10px] text-[#888888] border border-[#222222]">
            Generador Online
        </div>
    </div>

    <!-- Footer Links -->
    <div class="mt-8 text-[#888888] text-xs flex gap-6 justify-center">
        <a href="https://wa.me/573232822796?text=Quiero%20informaci%C3%B3n%20de%20como%20activar%20Gemini%20pro." target="_blank" rel="noopener noreferrer" class="hover:text-[#FF6600] transition-colors">Soporte 24/7</a>
        <a href="https://screengo.uk" target="_blank" rel="noopener noreferrer" class="hover:text-[#FF6600] transition-colors">Catálogo</a>
        <a href="https://www.facebook.com/ScreenGoApp" target="_blank" rel="noopener noreferrer" class="hover:text-[#FF6600] transition-colors">Nosotros</a>
    </div>

    <script>
        const secretInput = document.getElementById('secret');
        const codeDisplay = document.getElementById('code-display');
        const progressBar = document.getElementById('progress-bar');
        const timeLeftDisplay = document.getElementById('time-left');
        const errorMsg = document.getElementById('error-msg');
        const copyBtn = document.getElementById('copy-btn');
        const copyIcon = document.getElementById('copy-icon');
        const checkIcon = document.getElementById('check-icon');
        const copyText = document.getElementById('copy-text');

        let currentCode = '000 000';

        function updateToken() {
            const secret = secretInput.value;
            
            if (!secret.trim()) {
                currentCode = '000 000';
                codeDisplay.textContent = currentCode;
                timeLeftDisplay.textContent = '30 segundos';
                progressBar.style.width = '100%';
                errorMsg.classList.add('hidden');
                copyBtn.disabled = true;
                return;
            }

            try {
                const cleanSecret = secret.replace(/\s+/g, '').toUpperCase();
                
                const totp = new OTPAuth.TOTP({
                    issuer: 'ScreenGo',
                    label: '2FA',
                    algorithm: 'SHA1',
                    digits: 6,
                    period: 30,
                    secret: OTPAuth.Secret.fromBase32(cleanSecret)
                });
                
                const token = totp.generate();
                currentCode = `${token.slice(0, 3)} ${token.slice(3)}`;
                codeDisplay.textContent = currentCode;
                errorMsg.classList.add('hidden');
                copyBtn.disabled = false;
                
                const epoch = Math.floor(Date.now() / 1000);
                const remaining = 30 - (epoch % 30);
                timeLeftDisplay.textContent = `${remaining} segundos`;
                progressBar.style.width = `${(remaining / 30) * 100}%`;
            } catch (err) {
                currentCode = '--- ---';
                codeDisplay.textContent = currentCode;
                errorMsg.classList.remove('hidden');
                timeLeftDisplay.textContent = '0 segundos';
                progressBar.style.width = '0%';
                copyBtn.disabled = true;
            }
        }

        secretInput.addEventListener('input', updateToken);
        setInterval(updateToken, 1000);

        copyBtn.addEventListener('click', async () => {
            if (currentCode === '000 000' || currentCode === '--- ---') return;
            
            try {
                await navigator.clipboard.writeText(currentCode.replace(' ', ''));
                
                copyIcon.classList.add('hidden');
                checkIcon.classList.remove('hidden');
                copyText.textContent = '¡Copiado!';
                
                setTimeout(() => {
                    copyIcon.classList.remove('hidden');
                    checkIcon.classList.add('hidden');
                    copyText.textContent = 'Copiar Código';
                }, 2000);
            } catch (err) {
                console.error('Failed to copy text: ', err);
            }
        });
    </script>
</body>
</html>
